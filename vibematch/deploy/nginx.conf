# /etc/nginx/sites-available/boring.omelt.space
# После установки: sudo certbot --nginx -d boring.omelt.space  (добавит HTTPS)
server {
    listen 80;
    listen [::]:80;
    server_name boring.omelt.space;

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s; # места из OpenStreetMap могут грузиться до ~20 с
    }
}
